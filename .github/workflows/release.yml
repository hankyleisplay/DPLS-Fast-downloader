name: Release DPLS-Fast (Cross-Platform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Package Browser Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Extension
        run: |
          cd extension
          zip -r ../dpls-fast-browser-extension.zip ./*

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpls-fast-browser-extension
          path: dpls-fast-browser-extension.zip

  build-desktop:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            cli_name: dpls.exe
            gui_pattern: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos
            cli_name: dpls
            gui_pattern: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            platform: linux
            cli_name: dpls
            gui_pattern: src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build CLI Binary
        run: |
          cargo build --release --bin dpls

      - name: Copy CLI Binary to Release Folder
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/${{ matrix.cli_name }} artifacts/${{ matrix.platform }}-${{ matrix.cli_name }}

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DPLS-Fast ${{ github.ref_name }}'
          releaseBody: '極速多線程下載器 DPLS-Fast (IDM-like Engine) 最新跨平台發行版本'
          releaseDraft: true
          prerelease: false

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpls-cli-${{ matrix.platform }}
          path: artifacts/*
