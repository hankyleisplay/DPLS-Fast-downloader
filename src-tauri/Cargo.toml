[package]
name = "dpls-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dpls-desktop"
path = "src/main.rs"

[dependencies]
dpls-fast = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
dirs = "5.0"

[build-dependencies]
tauri-build = { version = "2" }
